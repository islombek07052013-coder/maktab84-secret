<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kengaytirilgan Admin Panel — Denov 84-maktab</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 900px; margin: 30px auto; padding: 30px; background: linear-gradient(135deg, #0d223f, #061324); border-radius: 20px; border: 2px solid var(--color-gold-400); box-shadow: var(--gold-glow); color: #fff; }
    .admin-nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 15px; flex-wrap: wrap; }
    .tab-btn { background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(212, 175, 55, 0.3); padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.2s; }
    .tab-btn.active { background: var(--gold-gradient); color: #000; box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; color: var(--color-gold-300); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.4); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; }
    
    .login-box { max-width: 400px; margin: 120px auto; padding: 35px; background: #0b1c33; border-radius: 16px; border: 2px solid var(--color-gold-400); text-align: center; box-shadow: var(--shadow-md); }
    .delete-btn { background: #dc2626; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(212,175,55,0.2); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Parol Kirish Qismi -->
  <div id="loginSection" class="login-box">
    <h3 style="color: var(--color-gold-300); margin-bottom: 20px;">🔒 Maxfiy Kirish</h3>
    <input type="password" id="adminPassword" placeholder="Parolni kiriting..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #d4af37; background: #000; color: #fff; margin-bottom: 15px; text-align: center;">
    <button type="button" onclick="verifyAdmin()" class="btn btn-primary" style="width: 100%;">Kirish</button>
    <p id="loginError" style="color: #ff4d4d; margin-top: 12px; display: none;">❌ Parol noto'g'ri!</p>
  </div>

  <!-- Asosiy Admin Panel -->
  <div id="adminPanel" class="admin-container" style="display: none;">
    <h2>🛠️ 84-Maktab Boshqaruv Markazi</h2>
    
    <!-- Ichki Bo'limlar Navigatsiyasi -->
    <div class="admin-nav-tabs">
      <button class="tab-btn active" onclick="switchTab('teachersTab', this)">👨‍🏫 Ustozlar</button>
      <button class="tab-btn" onclick="switchTab('scheduleTab', this)">📅 Dars Jadvali</button>
      <button class="tab-btn" onclick="switchTab('galleryTab', this)">🖼️ Xonalar Rasmlari</button>
    </div>

    <!-- 1-BO'LIM: USTOZLAR -->
    <div id="teachersTab" class="tab-content active">
      <form id="addTeacherForm">
        <h3 style="color: var(--color-gold-400); margin-bottom: 15px;">➕ Yangi Ustoz Qo'shish</h3>
        <div class="form-group"><label>To'liq F.I.Sh:</label><input type="text" id="tName" required></div>
        <div class="form-group"><label>Fani / Lavozimi:</label><input type="text" id="tSubject" required></div>
        <div class="form-group"><label>Bio:</label><textarea id="tBio" rows="2" required></textarea></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">💾 Saqlash</button>
      </form>
      <div style="margin-top: 25px;">
        <h4 style="color: var(--color-gold-300); margin-bottom: 10px;">📋 Bazadagi Ustozlar</h4>
        <div id="teachersList">Yuklanmoqda...</div>
      </div>
    </div>

    <!-- 2-BO'LIM: DARS JADVALI (Yangi Fan Qo'shish/O'zgartirish) -->
    <div id="scheduleTab" class="tab-content">
      <form id="updateScheduleForm">
        <h3 style="color: var(--color-gold-400); margin-bottom: 15px;">✏️ Dars Jadvaliga Fan Qo'shish / Yangilash</h3>
        <div class="form-group">
          <label>Sinfni Tanlang:</label>
          <select id="sClass">
            <option value="1a">1-"A" Sinf</option>
            <option value="5a">5-"A" Sinf</option>
            <option value="7a">7-"A" Sinf</option>
            <option value="11a">11-"A" Sinf</option>
          </select>
        </div>
        <div class="form-group">
          <label>Hafta Kuni:</label>
          <select id="sDay">
            <option value="Dushanba">Dushanba</option>
            <option value="Seshanba">Seshanba</option>
            <option value="Chorshanba">Chorshan
