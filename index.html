<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxfiy Admin Panel — Denov 84-maktab</title>
  <style>
    :root {
      --color-navy-900: #06111e; 
      --color-navy-800: #0b1c33;
      --color-navy-700: #122847; 
      --color-gold-300: #f3e5ab;
      --color-gold-400: #d4af37; 
      --gold-gradient: linear-gradient(135deg, #ffe599 0%, #cda059 50%, #996515 100%);
      --gold-glow: 0 0 20px rgba(212, 175, 55, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top center, #0f2546 0%, #06111e 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .admin-container { width: 100%; max-width: 950px; padding: 30px; background: linear-gradient(135deg, #0d223f, #061324); border-radius: 20px; border: 2px solid var(--color-gold-400); box-shadow: var(--gold-glow); color: #fff; }
    .admin-container h2 { text-align: center; margin-bottom: 25px; color: var(--color-gold-300); font-family: 'Poppins', sans-serif; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; color: var(--color-gold-300); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.4); background: rgba(0,0,0,0.6); color: #fff; font-family: inherit; outline: none; font-size: 1rem; }
    .login-box { width: 100%; max-width: 400px; padding: 35px; background: #0b1c33; border-radius: 16px; border: 2px solid var(--color-gold-400); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 25px; border: 0; border-radius: 999px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem; }
    .btn-primary { background: var(--gold-gradient); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); width: 100%; margin-top: 10px; }
    .btn-secondary { background: transparent; border: 2px solid var(--color-gold-400); color: var(--color-gold-300); text-decoration: none; }
    .btn-secondary:hover { background: var(--color-gold-400); color: #000; }
    .manage-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(212, 175, 55, 0.2); }
    .delete-btn { background: #dc2626; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .delete-btn:hover { background: #b91c1c; }
    .section-divider { margin-top: 40px; border-top: 2px dashed rgba(212, 175, 55, 0.3); padding-top: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(212, 175, 55, 0.2); font-size: 0.9rem; }
    th { color: var(--color-gold-300); background: rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <!-- Parol Kirish Oynasi -->
  <div id="loginSection" class="login-box">
    <h3 style="color: var(--color-gold-300); margin-bottom: 20px;">🔒 Maxfiy Kirish</h3>
    <input type="password" id="adminPassword" placeholder="Parolni kiriting..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #d4af37; background: #000; color: #fff; margin-bottom: 15px; text-align: center; outline: none;">
    <button type="button" onclick="verifyAdmin()" class="btn btn-primary">Kirish</button>
    <p id="loginError" style="color: #ff4d4d; margin-top: 12px; font-size: 0.9rem; display: none;">❌ Parol noto'g'ri!</p>
  </div>

  <!-- Asosiy Boshqaruv Paneli -->
  <div id="adminPanel" class="admin-container" style="display: none;">
    <h2>🛠️ Denov 84-Maktab Boshqaruv Paneli</h2>
    
    <!-- 1. USTOZLAR VA DIREKTORNI BOSHQARISH -->
    <form id="addTeacherForm">
      <h3 style="font-size: 1.2rem; margin-bottom: 15px; color: var(--color-gold-400);">👨‍🏫 Yangi Ustoz yoki Rahbar Qo'shish</h3>
      <div class="form-group">
        <label>To'liq F.I.Sh:</label>
        <input type="text" id="tName" placeholder="Masalan: Ismayilov Sherzod Chorievich" required>
      </div>
      <div class="form-group">
        <label>Fani / Lavozimi:</label>
        <input type="text" id="tSubject" placeholder="Masalan: Maktab Direktori" required>
      </div>
      <div class="form-group">
        <label>Ma'lumot (Toifasi):</label>
        <input type="text" id="tBio" placeholder="Masalan: Oliy toifali pedagog" required>
      </div>
      <button type="submit" class="btn btn-primary">💾 Saqlash</button>
    </form>

    <div style="margin-top: 25px;">
      <h4 style="color: var(--color-gold-300); margin-bottom: 12px;">📋 Barcha Ustozlar Ro'yxati</h4>
      <div id="adminTeachersList">Yuklanmoqda...</div>
    </div>

    <!-- 2. DARS JADVALINI BOSHQARISH (1-11 A, B, V) -->
    <div class="section-divider">
      <form id="addScheduleForm">
        <h3 style="font-size: 1.2rem; margin-bottom: 15px; color: var(--color-gold-400);">📅 Dars Jadvalini Qo'shish / O'zgartirish</h3>
        <div class="form-group">
          <label>Sinfni Tanlang (1-11 A, B, V):</label>
          <select id="sClass" required>
            <option value="1-A sinf">1-A sinf</option><option value="1-B sinf">1-B sinf</option><option value="1-V sinf">1-V sinf</option>
            <option value="2-A sinf">2-A sinf</option><option value="2-B sinf">2-B sinf</option><option value="2-V sinf">2-V sinf</option>
            <option value="3-A sinf">3-A sinf</option><option value="3-B sinf">3-B sinf</option><option value="3-V sinf">3-V sinf</option>
            <option value="4-A sinf">4-A sinf</option><option value="4-B sinf">4-B sinf</option><option value="4-V sinf">4-V sinf</option>
            <option value="5-A sinf">5-A sinf</option><option value="5-B sinf">5-B sinf</option><option value="5-V sinf">5-V sinf</option>
            <option value="6-A sinf">6-A sinf</option><option value="6-B sinf">6-B sinf</option><option value="6-V sinf">6-V sinf</option>
            <option value="7-A sinf">7-A sinf</option><option value="7-B sinf">7-B sinf</option><option value="7-V sinf">7-V sinf</option>
            <option value="8-A sinf">8-A sinf</option><option value="8-B sinf">8-B sinf</option><option value="8-V sinf">8-V sinf</option>
            <option value="9-A sinf">9-A sinf</option><option value="9-B sinf">9-B sinf</option><option value="9-V sinf">9-V sinf</option>
            <option value="10-A sinf">10-A sinf</option><option value="10-B sinf">10-B sinf</option><option value="10-V sinf">10-V sinf</option>
            <option value="11-A sinf">11-A sinf</option><option value="11-B sinf">11-B sinf</option><option value="11-V sinf">11-V sinf</option>
          </select>
        </div>
        <div class="form-group">
          <label>Hafta kuni:</label>
          <select id="sDay" required>
            <option value="Dushanba">Dushanba</option>
            <option value="Seshanba">Seshanba</option>
            <option value="Chorshanba">Chorshanba</option>
            <option value="Payshanba">Payshanba</option>
            <option value="Juma">Juma</option>
            <option value="Shanba">Shanba</option>
          </select>
        </div>
        <div class="form-group">
          <label>Darslar ro'yxati (vergul bilan ajratib yozing):</label>
          <input type="text" id="sLessons" placeholder="Ona tili, Matematika, O'qish, Jismoniy tarbiya" required>
        </div>
        <button type="submit" class="btn btn-primary">📅 Jadvalni Saqlash</button>
      </form>

      <div style="margin-top: 25px;">
        <h4 style="color: var(--color-gold-300); margin-bottom: 12px;">📋 Sinflarning Dars Jadvallari</h4>
        <div id="adminScheduleList">Yuklanmoqda...</div>
      </div>
    </div>

    <!-- TUGMALAR -->
    <div style="margin-top: 35px; text-align: center; display: flex; justify-content: space-between; gap: 15px;">
      <button type="button" onclick="logoutAdmin()" class="btn btn-secondary" style="border-color: #ff4d4d; color: #ff4d4d; width: 50%;">🔒 Chiqish</button>
      <a href="https://islombek07052013-coder.github.io/84-maktab/" class="btn btn-secondary" style="width: 50%; display: flex; align-items: center; justify-content: center;" target="_blank">⬅️ Asosiy Saytni Ko'rish</a>
    </div>
  </div>

  <script>
    const MY_SECRET_PASSWORD = "84maktab";

    function verifyAdmin() {
      if (document.getElementById('adminPassword').value === MY_SECRET_PASSWORD) {
        sessionStorage.setItem('isLoggedIn', 'true');
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdminData();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdminData();
      }
    });

    function logoutAdmin() { sessionStorage.removeItem('isLoggedIn'); location.reload(); }

    // 37 ta haqiqiy ustozlar ro'yxati

      { id: 11, full_name: "Eshonqulova Afifabonu Tulqin qizi", subject: "Rus tili va adabiyoti o'qituvchisi", bio: "1-toifa" },
      { id: 12, full_name: "Mamajonova Nilufar Abdubannon qizi", subject: "Rus tili va adabiyoti o'qituvchisi", bio: "2-toifa" },
      { id: 13, full_name: "Mardanova Zarnigor Alisher qizi", subject: "Ingliz tili o'qituvchisi", bio: "1-toifa" },
      { id: 14, full_name: "Karimov Abdulxofiz Abduvaxob o'g'li", subject: "Ingliz tili o'qituvchisi", bio: "1-toifa" },

      { id: 27, full_name: "Jo'raeva Shaxlo Abdurayimovna", subject: "Geografiya o'qituvchisi", bio: "Oliy toifa" },
      { id: 28, full_name: "Ergasheva Pokiza Anvar qizi", subject: "Geografiya o'qituvchisi", bio: "2-toifa" },
      { id: 29, full_name: "Xaydarov Muhammad Zahriddinovich", subject: "Musiqa o'qituvchisi", bio: "Oliy toifa" },
      { id: 30, full_name: "Fayzullaeva Iqbol Boyburievna", subject: "Tasviriy san'at o'qituvchisi", bio: "Oliy toifa" },
      { id: 31, full_name: "Terkashov Sirojiddin Abdusamatovich", subject: "Tasviriy san'at va chizmachilik o'qituvchisi", bio: "1-toifa" },
      { id: 32, full_name: "Normuminov Ulugbek Tojimurotovich", subject: "Jismoniy tarbiya o'qituvchisi", bio: "1-toifa" },
      { id: 33, full_name: "Akramov Xumoiddin Akmal o'g'li", subject: "Jismoniy tarbiya o'qituvchisi", bio: "1-toifa" },
      { id: 34, full_name: "Davlatova Etibor Abdunazarovna", subject: "Boshlang'ich sinf o'qituvchisi", bio: "Oliy toifa" },
      { id: 35, full_name: "Normurodova Dilrabo Erkin qizi", subject: "Boshlang'ich sinf o'qituvchisi", bio: "1-toifa" },
      { id: 36, full_name: "Irismatova Dilbar Chorievna", subject: "Boshlang'ich sinf o'qituvchisi", bio: "1-toifa" },
      { id: 37, full_name: "Jumaeva Sharifa Umarali qizi", subject: "Boshlang'ich sinf o'qituvchisi", bio: "2-toifa" }
    ];

    function getStoredTeachers() {
      const data = localStorage.getItem('school_teachers_v3');
      if (!data) {
        localStorage.setItem('school_teachers_v3', JSON.stringify(defaultTeachersList));
        return defaultTeachersList;
      }
      return JSON.parse(data);
    }

    function getStoredSchedules() {
      const data = localStorage.getItem('school_schedules_v3');
      if (!data) {
        const defaults = [
          { id: 1, class_name: "1-A sinf", day: "Dushanba", lessons: "Ona tili, Matematika, O'qish, Jismoniy tarbiya, Odobnoma" },
          { id: 2, class_name: "5-A sinf", day: "Dushanba", lessons: "Matematika, Ona tili, Ingliz tili, Tarix" },
          { id: 3, class_name: "11-A sinf", day: "Dushanba", lessons: "Algebra, Fizika, Kimyo, Tarix, Ingliz tili" }
        ];
        localStorage.setItem('school_schedules_v3', JSON.stringify(defaults));
        return defaults;
      }
      return JSON.parse(data);
    }

    function loadAdminData() {
      loadAdminTeachers();
      loadAdminSchedules();
    }

    // Ustoz qo'shish
    document.getElementById('addTeacherForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const teachers = getStoredTeachers();
      const newTeacher = {
        id: Date.now(),
        full_name: document.getElementById('tName').value,
        subject: document.getElementById('tSubject').value,
        bio: document.getElementById('tBio').value
      };
      teachers.push(newTeacher);
      localStorage.setItem('school_teachers_v3', JSON.stringify(teachers));
      alert('✅ Ustoz muvaffaqiyatli qo\'shildi!');
      document.getElementById('addTeacherForm').reset();
      loadAdminTeachers();
    });

    // Ustozlarni chiqarish
    function loadAdminTeachers() {
      const listContainer = document.getElementById('adminTeachersList');
      const teachers = getStoredTeachers();
      
      if (teachers.length === 0) {
        listContainer.innerHTML = 'Hozircha ustozlar yo\'q.';
        return;
      }

      listContainer.innerHTML = '';
      teachers.forEach(t => {
        const item = document.createElement('div');
        item.className = 'manage-item';
        item.innerHTML = `
          <div>
            <strong>${t.full_name}</strong> <small style="color:#cbd5e1;">(${t.bio || ''})</small><br>
            <small style="color:#d4af37;">${t.subject}</small>
          </div>
          <button class="delete-btn" onclick="deleteTeacher(${t.id})">O'chirish</button>
        `;
        listContainer.appendChild(item);
      });
    }

    function deleteTeacher(id) {
      if (!confirm("Haqiqatan ham bu ustozni o'chirmoqchimisiz?")) return;
      let teachers = getStoredTeachers();
      teachers = teachers.filter(t => t.id !== id);
      localStorage.setItem('school_teachers_v3', JSON.stringify(teachers));
      loadAdminTeachers();
    }

    // Dars jadvalini qo'shish
    document.getElementById('addScheduleForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const schedules = getStoredSchedules();
      const newSchedule = {
        id: Date.now(),
        class_name: document.getElementById('sClass').value,
        day: document.getElementById('sDay').value,
        lessons: document.getElementById('sLessons').value
      };
      schedules.push(newSchedule);
      localStorage.setItem('school_schedules_v3', JSON.stringify(schedules));
      alert('✅ Dars jadvali saqlandi!');
      document.getElementById('addScheduleForm').reset();
      loadAdminSchedules();
    });

    // Dars jadvallarini chiqarish
    function loadAdminSchedules() {
      const listContainer = document.getElementById('adminScheduleList');
      const schedules = getStoredSchedules();

      if (schedules.length === 0) {
        listContainer.innerHTML = 'Hozircha dars jadvallari kiritilmagan.';
        return;
      }

      listContainer.innerHTML = `
        <table>
          <tr>
            <th>Sinf</th>
            <th>Hafta kuni</th>
            <th>Darslar</th>
            <th>Amal</th>
          </tr>
        </table>
      `;
      const table = listContainer.querySelector('table');

      schedules.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${s.class_name}</strong></td>
          <td><span style="color:var(--color-gold-300);">${s.day}</span></td>
          <td>${s.lessons}</td>
          <td><button class="delete-btn" style="padding:4px 10px; font-size:0.8rem;" onclick="deleteSchedule(${s.id})">O'chirish</button></td>
        `;
        table.appendChild(row);
      });
    }

    function deleteSchedule(id) {
      if (!confirm("O'chirmoqchimisiz?")) return;
      let schedules = getStoredSchedules();
      schedules = schedules.filter(s => s.id !== id);
      localStorage.setItem('school_schedules_v3', JSON.stringify(schedules));
      loadAdminSchedules();
    }
  </script>
</body>
</html>
