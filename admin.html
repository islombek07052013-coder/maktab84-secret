<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Denov 84-maktab</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans">

<div id="login-screen" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-50">
  <form onsubmit="login(event)" class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-3">
    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-user-shield"></i></div>
    <h2 class="text-2xl font-bold text-gray-800">Maktab Admin</h2>
    <p class="text-sm text-gray-500">GitHub token bilan kiring (faqat shu brauzerda saqlanadi)</p>
    <input id="token" type="password" required placeholder="github_pat_..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm">Kirish</button>
    <p id="error-msg" class="hidden text-red-500 text-sm bg-red-50 p-2 rounded-lg border border-red-200">Token noto'g'ri!</p>
  </form>
</div>

<div id="admin-dashboard" class="hidden">
  <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div><h1 class="text-xl font-bold">Denov 84-maktab</h1><p class="text-xs text-blue-200">Admin Boshqaruv Markazi</p></div>
      <div class="flex gap-2">
        <a id="site-link" href="#" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-sm"><i class="fa-solid fa-globe"></i> Saytni ko'rish</a>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <div class="flex flex-wrap gap-2 border-b border-gray-200 pb-3">
      <button onclick="switchTab('teachers')" id="tab-teachers" class="px-5 py-2.5 rounded-xl text-sm"><i class="fa-solid fa-chalkboard-user"></i> O'qituvchilar</button>
      <button onclick="switchTab('schedule')" id="tab-schedule" class="px-5 py-2.5 rounded-xl text-sm"><i class="fa-solid fa-calendar-days"></i> Dars Jadvallari</button>
      <button onclick="switchTab('rooms')" id="tab-rooms" class="px-5 py-2.5 rounded-xl text-sm"><i class="fa-solid fa-images"></i> Xona Galereyasi</button>
    </div>

    <section id="sec-teachers" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <form onsubmit="addTeacher(event)" class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
        <h3 class="font-bold text-lg">Ustoz qo'shish</h3>
        <input id="t-name" required placeholder="F.I.O" class="w-full px-3 py-2 border rounded-lg text-sm">
        <input id="t-subject" required placeholder="Fani / lavozimi" class="w-full px-3 py-2 border rounded-lg text-sm">
        <select id="t-badge" class="w-full px-3 py-2 border rounded-lg text-sm"><option>Oliy toifa</option><option>1-toifa</option><option>2-toifa</option><option>Mutaxassis</option></select>
        <textarea id="t-bio" rows="2" placeholder="Batafsil ma'lumot (bio)" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm">Saqlash</button>
      </form>
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm">
        <h3 class="font-bold text-lg mb-3 flex justify-between">Ustozlar ro'yxati <span id="t-count" class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full">0 ta</span></h3>
        <div class="max-h-[420px] overflow-y-auto"><table class="w-full text-left text-sm text-gray-600"><tbody id="teachers-list"></tbody></table></div>
      </div>
    </section>

    <section id="sec-schedule" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      <form onsubmit="addSchedule(event)" class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
        <h3 class="font-bold text-lg">Jadval qo'shish / o'zgartirish</h3>
        <select id="s-class" class="w-full px-3 py-2 border rounded-lg text-sm"></select>
        <select id="s-day" class="w-full px-3 py-2 border rounded-lg text-sm"></select>
        <textarea id="s-details" required rows="5" placeholder="1. Ona tili&#10;2. Matematika" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm">Jadvalni saqlash</button>
      </form>
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm">
        <h3 class="font-bold text-lg mb-3 flex justify-between">Barcha jadvallar <span id="s-count" class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full">0 ta</span></h3>
        <div id="schedule-list" class="grid md:grid-cols-2 gap-3 max-h-[450px] overflow-y-auto"></div>
      </div>
    </section>

    <section id="sec-rooms" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
        <h3 class="font-bold text-lg">Rasm qo'shish</h3>
        <form onsubmit="addRoomImage(event)" class="space-y-3">
          <select id="r-room" required class="w-full px-3 py-2 border rounded-lg text-sm"></select>
          <input type="file" id="r-file" accept="image/*" multiple required class="w-full text-sm text-gray-500">
          <button id="r-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm">Yuklash</button>
        </form>
        <button onclick="addRoom()" class="w-full border border-blue-600 text-blue-600 py-2 rounded-lg text-sm">+ Yangi xona qo'shish</button>
      </div>
      <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm">
        <h3 class="font-bold text-lg mb-3 flex justify-between">Xonalar <span id="r-count" class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full">0 ta</span></h3>
        <div id="rooms-gallery" class="space-y-4 max-h-[500px] overflow-y-auto"></div>
      </div>
    </section>
  </main>
</div>

<script>
const REPO = '84-maktab', DAYS = ['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
let TOKEN = localStorage.getItem('m84_token'), OWNER = localStorage.getItem('m84_owner'), DATA = null, SHA = null;
const $ = id => document.getElementById(id), v = id => $(id).value.trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = s => btoa(unescape(encodeURIComponent(s))), dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g, ''))));
const gh = (p, o = {}) => fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${p}`, { cache: 'no-store', ...o, headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json' } });
const imgUrl = s => /^https?:/.test(s) ? s : `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${s}`;

function toast(t) {
  let d = $('toast');
  if (!d) { d = document.createElement('div'); d.id = 'toast'; d.className = 'fixed bottom-4 right-4 bg-slate-800 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50'; document.body.appendChild(d); }
  d.textContent = t; d.style.display = 'block'; clearTimeout(d._t); d._t = setTimeout(() => d.style.display = 'none', 4000);
}

window.onload = () => {
  $('s-class').innerHTML = [...Array(11)].map((_, i) => ['A','B','V'].map(l => `<option value="${i+1}-${l} sinf">${i+1}-${l} sinf</option>`).join('')).join('');
  $('s-day').innerHTML = DAYS.map(d => `<option>${d}</option>`).join('');
  switchTab('teachers');
  if (TOKEN && OWNER) start();
};

async function login(e) {
  e.preventDefault();
  const t = v('token'), r = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + t } });
  if (!r.ok) return $('error-msg').classList.remove('hidden');
  TOKEN = t; OWNER = (await r.json()).login;
  localStorage.setItem('m84_token', TOKEN); localStorage.setItem('m84_owner', OWNER);
  start();
}
function logout() { localStorage.removeItem('m84_token'); localStorage.removeItem('m84_owner'); location.reload(); }

async function start() {
  $('login-screen').classList.add('hidden'); $('admin-dashboard').classList.remove('hidden');
  $('site-link').href = `https://${OWNER}.github.io/${REPO}/`;
  try { await load(); } catch (err) { alert(err.message); return logout(); }
  renderAll();
}

// data.json: saytning yagona ma'lumot fayli
async function load() {
  const r = await gh('contents/data.json');
  if (r.ok) { const j = await r.json(); SHA = j.sha; DATA = JSON.parse(dec(j.content)); return; }
  if (r.status !== 404) throw new Error('GitHub xatosi ' + r.status + ': token yoki repozitoriya ruxsatini tekshiring.');
  // Birinchi marta: mavjud ustozlar va xonalarni index.html dan olamiz
  const h = await gh('contents/index.html');
  if (!h.ok) throw new Error(`"${REPO}" repozitoriyasi topilmadi yoki tokenda ruxsat yo'q.`);
  const doc = new DOMParser().parseFromString(dec((await h.json()).content), 'text/html'), t0 = Date.now();
  const q = (el, s) => el.querySelector(s)?.textContent.trim() || '';
  SHA = null;
  DATA = {
    teachers: [...doc.querySelectorAll('.featured-teachers-list .teacher-card')].map((c, i) => ({ id: t0 + i, name: q(c, 'h3'), subject: q(c, '.teacher-role'), badge: q(c, '.teacher-badge'), bio: c.dataset.bio || '' })),
    schedules: [],
    rooms: [...doc.querySelectorAll('.room-card')].map((c, i) => ({ id: t0 + 1000 + i, title: q(c, 'h3'), badge: q(c, '.room-badge'), desc: q(c, '.room-info p'), images: [c.querySelector('img')?.getAttribute('src')].filter(Boolean) }))
  };
}

async function save() {
  DATA.schedules.sort((a, b) => a.class_name.localeCompare(b.class_name, 'uz', { numeric: true }) || DAYS.indexOf(a.day) - DAYS.indexOf(b.day));
  const body = { message: "Admin: ma'lumot yangilandi", content: enc(JSON.stringify(DATA, null, 1)) };
  if (SHA) body.sha = SHA;
  const r = await gh('contents/data.json', { method: 'PUT', body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Saqlanmadi (' + r.status + ')');
  SHA = (await r.json()).content.sha;
}
async function commit() {
  toast('Saqlanmoqda...');
  try { await save(); toast("Saqlandi. Sayt 1-2 daqiqada yangilanadi."); }
  catch (err) { alert(err.message + "\nSahifa ma'lumotlari qayta yuklanadi."); await load(); }
  renderAll();
}

const ACT = 'px-5 py-2.5 rounded-xl text-sm bg-blue-600 text-white shadow', PAS = 'px-5 py-2.5 rounded-xl text-sm bg-white text-gray-600 border border-gray-200';
function switchTab(n) {
  ['teachers', 'schedule', 'rooms'].forEach(t => { $('sec-' + t).classList.toggle('hidden', t !== n); $('tab-' + t).className = t === n ? ACT : PAS; });
}
function renderAll() { renderTeachers(); renderSchedule(); renderRooms(); }

// O'qituvchilar
function renderTeachers() {
  $('t-count').textContent = DATA.teachers.length + ' ta';
  $('teachers-list').innerHTML = DATA.teachers.map((t, i) => `<tr class="border-b"><td class="py-2 px-2">${i + 1}</td><td class="py-2 px-2 font-medium">${esc(t.name)}</td><td class="py-2 px-2">${esc(t.subject)}</td><td class="py-2 px-2">${esc(t.badge)}</td><td class="py-2 px-2 text-right"><button onclick="deleteTeacher(${t.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('') || '<tr><td class="py-4 text-center text-gray-400">Ustozlar yo\'q</td></tr>';
}
async function addTeacher(e) {
  e.preventDefault();
  DATA.teachers.push({ id: Date.now(), name: v('t-name'), subject: v('t-subject'), badge: v('t-badge'), bio: v('t-bio') });
  e.target.reset(); await commit();
}
async function deleteTeacher(id) {
  if (!confirm("Bu ustozni o'chirmoqchimisiz?")) return;
  DATA.teachers = DATA.teachers.filter(x => x.id !== id); await commit();
}

// Dars jadvali
function renderSchedule() {
  $('s-count').textContent = DATA.schedules.length + ' ta';
  $('schedule-list').innerHTML = DATA.schedules.map(s => `<div class="border rounded-xl p-3 bg-slate-50 relative"><button onclick="deleteSchedule(${s.id})" class="absolute top-2 right-2 text-red-500"><i class="fa-solid fa-trash"></i></button><div class="font-bold text-blue-600">${esc(s.class_name)}</div><div class="text-xs text-gray-500 mb-1">${esc(s.day)}</div><pre class="text-xs font-sans whitespace-pre-wrap">${esc(s.lessons)}</pre></div>`).join('') || '<div class="text-gray-400 col-span-full text-center">Jadval kiritilmagan</div>';
}
async function addSchedule(e) {
  e.preventDefault();
  const class_name = v('s-class'), day = v('s-day');
  DATA.schedules = DATA.schedules.filter(x => !(x.class_name === class_name && x.day === day));
  DATA.schedules.push({ id: Date.now(), class_name, day, lessons: $('s-details').value.trim() });
  e.target.reset(); await commit();
}
async function deleteSchedule(id) {
  if (!confirm("Jadvalni o'chirmoqchimisiz?")) return;
  DATA.schedules = DATA.schedules.filter(x => x.id !== id); await commit();
}

// Xona rasmlari
function renderRooms() {
  $('r-count').textContent = DATA.rooms.length + ' ta';
  $('r-room').innerHTML = DATA.rooms.map(r => `<option value="${r.id}">${esc(r.title)}</option>`).join('');
  $('rooms-gallery').innerHTML = DATA.rooms.map(r => `<div class="border rounded-xl p-3 bg-slate-50"><div class="flex justify-between mb-2"><b>${esc(r.title)}</b><button onclick="deleteRoom(${r.id})" class="text-red-500 text-xs">Xonani o'chirish</button></div><div class="grid grid-cols-3 md:grid-cols-4 gap-2">${r.images.map((s, k) => `<div class="relative"><img src="${esc(imgUrl(s))}" class="w-full h-20 object-cover rounded">${k ? `<button onclick="setCover(${r.id},${k})" title="Asosiy rasm qilish" class="absolute bottom-1 left-1 bg-white/90 rounded px-1 text-xs">★</button>` : '<span class="absolute bottom-1 left-1 bg-yellow-400 rounded px-1 text-xs">asosiy</span>'}<button onclick="deleteImage(${r.id},${k})" class="absolute top-1 right-1 bg-red-500 text-white rounded px-1.5 text-xs">✕</button></div>`).join('') || '<span class="text-xs text-gray-400">Rasm yo\'q</span>'}</div></div>`).join('');
}
function toJpeg(file) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1400 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    im.onerror = rej; im.src = URL.createObjectURL(file);
  });
}
async function removeFile(path) {
  if (!path.startsWith('images/rooms/')) return; // asl rasmlarga tegmaymiz
  try { const r = await gh('contents/' + path); if (r.ok) await gh('contents/' + path, { method: 'DELETE', body: JSON.stringify({ message: "Admin: rasm o'chirildi", sha: (await r.json()).sha }) }); } catch (e) {}
}
async function addRoomImage(e) {
  e.preventDefault();
  const room = DATA.rooms.find(r => r.id == v('r-room')), files = [...$('r-file').files], btn = $('r-btn');
  btn.disabled = true;
  for (const [i, f] of files.entries()) {
    btn.textContent = `Yuklanmoqda ${i + 1}/${files.length}...`;
    const path = `images/rooms/${Date.now()}-${i}.jpg`;
    const r = await gh('contents/' + path, { method: 'PUT', body: JSON.stringify({ message: "Admin: rasm qo'shildi", content: await toJpeg(f) }) });
    if (!r.ok) { alert('Rasm yuklanmadi (' + r.status + ')'); break; }
    room.images.push(path);
  }
  btn.disabled = false; btn.textContent = 'Yuklash'; e.target.reset(); await commit();
}
async function addRoom() {
  const title = (prompt('Yangi xona nomi:') || '').trim();
  if (!title) return;
  DATA.rooms.push({ id: Date.now(), title, badge: '🏫 Xona', desc: '', images: [] }); await commit();
}
async function deleteRoom(id) {
  if (!confirm("Xona va uning rasmlari saytdan o'chiriladi. Davom etasizmi?")) return;
  const r = DATA.rooms.find(x => x.id === id);
  DATA.rooms = DATA.rooms.filter(x => x.id !== id); await commit();
  for (const s of r.images) await removeFile(s);
}
async function deleteImage(id, k) {
  if (!confirm("Bu rasmni o'chirmoqchimisiz?")) return;
  const [p] = DATA.rooms.find(x => x.id === id).images.splice(k, 1); await commit(); removeFile(p);
}
async function setCover(id, k) {
  const im = DATA.rooms.find(x => x.id === id).images; im.unshift(im.splice(k, 1)[0]); await commit();
}
</script>
</body>
</html>
